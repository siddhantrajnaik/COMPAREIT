name: Scrape and deploy

# Scheduled scrape -> commit data -> build static site -> publish to Pages.
#
# Runs on GitHub's runners, which are datacenter IPs. Blinkit, Zepto, DMart and
# Flipkart serve those fine; Instamart, BigBasket and JioMart do not, so they're
# left out of the watchlist by default. That's a limitation of hosting, not of
# the adapters — running locally on a home connection reaches all of them.

on:
  # The schedule is intentionally DISABLED on GitHub-hosted runners.
  #
  # A real run proved they can't do the job: blinkit=0, zepto=0, dmart=0, and
  # only Flipkart's marketplace answered — with sugar-free cookies for a
  # brown-bread query. GitHub's runners are US-based, and these platforms serve
  # India only. Running this every 3 hours would just burn minutes republishing
  # a snapshot the quality gate correctly marks as untrustworthy.
  #
  # Enable it once you have a self-hosted runner in India (see DEPLOY.md), and
  # switch `runs-on` below to `self-hosted` at the same time.
  #
  # schedule:
  #   - cron: '17 */3 * * *'

  workflow_dispatch:        # manual refresh
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'watchlist.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write           # to commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: scrape-deploy
  cancel-in-progress: false   # never interrupt a run mid-commit

jobs:
  scrape:
    # Change to `self-hosted` if you run a runner in India — that's the only way
    # this job produces usable quick-commerce prices.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape watchlist
        id: scrape
        # A failed scrape must not wipe the site: we keep the last good data
        # and deploy that instead.
        continue-on-error: true
        env:
          HEADLESS: 'true'
          SCRAPE_DELAY_MS: '2500'
        run: node --disable-warning=ExperimentalWarning server/scripts/scrape-static.js

      - name: Discard the run if it produced untrustworthy data
        id: gate
        # A scrape from outside India returns no quick-commerce products. Left
        # alone, that snapshot would overwrite good committed data with an empty
        # one. Restore what's in git and build from that instead — a slightly
        # stale but correct site beats a fresh wrong one.
        run: |
          if [ -f web/public/data/snapshot.json ] \
             && node -e "process.exit(require('./web/public/data/snapshot.json').degraded ? 0 : 1)"; then
            echo "Scrape was degraded — restoring last good data."
            git checkout -- web/public/data || true
            rm -f .push-queue.json
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          else
            echo "degraded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send push notifications
        if: steps.scrape.outcome == 'success' && steps.gate.outputs.degraded == 'false'
        continue-on-error: true
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node --disable-warning=ExperimentalWarning server/scripts/send-push.js

      - name: Commit refreshed data
        if: steps.gate.outputs.degraded == 'false'
        run: |
          rm -f .push-queue.json
          if git diff --quiet -- web/public/data; then
            echo "No price changes this run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git commit -m "data: refresh prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Build static site
        env:
          VITE_STATIC: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback
        # Pages serves 404.html for unknown paths; making it the app keeps
        # client-side routing and hard refreshes working.
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
